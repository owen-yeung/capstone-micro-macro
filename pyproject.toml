[project]
name = "capstone-micro-macro"
version = "0.1.0"
description = "Capstone micro decisions and macro execution validation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lark==1.3.1",
  "pydantic==2.13.5",
  "langchain-core==1.6.3",
  "langchain-openai==1.6.2",
  "langgraph==1.2.11",
  "fastapi==0.141.1",
  "networkx==3.6.1",
  "pytest==9.1.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "uvicorn==0.53.0",
  "numpy==2.5.3",
  "matplotlib==3.11.2",
  "pillow==12.3.0"
]

[project.optional-dependencies]
baselines-award = ["pymcdm>=1.2.0"]
baselines-negotiate = ["negmas>=0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-p no:cacheprovider"
